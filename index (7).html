#greek{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#greek span{position:absolute;color:#cfeaff;text-shadow:0 0 8px #5fb4ff,0 0 22px #2f7bff;font-family:Georgia,serif;letter-spacing:3px;opacity:0;white-space:nowrap;animation:gk 6s ease-in-out forwards}
@keyframes gk{0%{opacity:0;transform:translateY(14px) scale(.95)}20%,45%{opacity:.85}100%{opacity:0;transform:translateY(-24px) scale(1.04)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.book{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:320px 1fr;border:14px solid #1b1442;position:relative;border-radius:16px;overflow:hidden;min-height:80vh;box-shadow:0 0 0 2px #c9a24a,0 0 80px color-mix(in srgb,var(--aura) 55%,transparent),0 25px 60px #000,inset 0 0 0 2px #1f120a}
.left{background:var(--paper2) radial-gradient(rgba(120,90,40,.08) 1px,transparent 1px) 0 0/5px 5px;box-shadow:inset -22px 0 24px -16px rgba(0,0,0,.4);padding:22px 20px 22px 18px}
.right{background:var(--paper) radial-gradient(rgba(120,90,40,.08) 1px,transparent 1px) 0 0/5px 5px;box-shadow:inset 22px 0 24px -16px rgba(0,0,0,.4);padding:26px 30px 40px 38px;min-width:0}
h1{font-size:21px;margin:10px 0 2px;letter-spacing:1px;text-align:center}
.tag{text-align:center;color:var(--muted);font-size:13px;font-style:italic;margin-bottom:14px}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.toc-title{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:8px 0}
.toc a{display:block;cursor:pointer;text-decoration:none;color:var(--ink)}
.toc .p{display:flex;gap:6px;align-items:baseline;padding:5px 4px;border-radius:5px;font-weight:bold;font-size:15px}
.toc .p:hover,.toc .p.on{background:var(--line)}
.toc .dots{flex:1;border-bottom:1px dotted var(--muted);transform:translateY(-3px);min-width:10px}
.toc .n{color:var(--muted);font-weight:normal;font-size:13px}
.toc .t{padding:1px 4px 1px 22px;font-size:13px;color:var(--muted)}
.toc .t:hover{color:var(--accent)}
.empty{color:var(--muted);font-style:italic;font-size:14px;padding:6px 2px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 12px;font-size:14px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.main{background:var(--accent);color:#fff;border-color:var(--accent)}
button.main:hover{color:#fff;opacity:.9}
button.del:hover{color:var(--danger);border-color:var(--danger)}
.add{width:100%;margin-top:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.num{color:var(--muted);font-size:13px;letter-spacing:1px}
.acts{display:flex;gap:6px}
.acts button{padding:3px 9px}
input.title{width:100%;font:bold 28px Georgia,serif;border:none;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:4px 0;outline:none}
input.sub{width:100%;font:italic 15px Georgia,serif;border:none;background:transparent;color:var(--muted);padding:6px 0 10px;outline:none}
input.title:focus,textarea:focus,input.tn:focus{border-color:var(--accent)}
textarea{width:100%;font:16px/1.55 Georgia,serif;color:var(--ink);background:repeating-linear-gradient(transparent,transparent 24px,var(--line) 25px);background-attachment:local;border:1px solid transparent;border-radius:4px;padding:2px 6px;resize:none;outline:none;min-height:80px;line-height:25px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:14px 0 4px}
h3{margin:28px 0 8px;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px}
.tech{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.tech .row{display:flex;gap:8px;align-items:center}
input.tn{flex:1;font:bold 18px Georgia,serif;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:3px 0;outline:none}
.media{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.media .m{position:relative}
.media img{max-height:170px;max-width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.x{position:absolute;top:4px;right:4px;padding:0 7px;font-size:15px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:10px}
.up{font-size:13px;padding:4px 10px}
.cover{text-align:center;padding:60px 10px;color:var(--muted)}
.emblem{display:block;width:100%;border-radius:10px;border:2px solid #c9a24a;background:radial-gradient(circle at 50% 45%,#22306e,#070a1c 80%);box-shadow:0 0 18px rgba(80,140,255,.5)}
.emblem.big{max-width:420px;margin:0 auto 14px}
.top{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}.info{flex:1;min-width:200px}
.portrait{position:relative;width:190px;height:240px;flex:none;background:#fff;padding:7px;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.35);transform:rotate(-1.5deg)}
.portrait img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.drop{border:2px dashed var(--muted);border-radius:8px;color:var(--muted);text-align:center;cursor:pointer;font-size:14px;background:transparent}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.drop.portrait{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper2);box-shadow:none;transform:none;padding:7px;font-size:34px;line-height:1.5}
.drop.portrait small{font-size:13px}
.drop.small{padding:14px;margin:6px 0}
.ro .drop,.ro .x,.ro .acts,.ro #addp,.ro #exp,.ro [data-addt],.ro .del{display:none!important}
.ro input.title,.ro input.sub,.ro input.tn{pointer-events:none}
#pg,.tech{position:relative}
.st{position:absolute;z-index:3;touch-action:none;cursor:grab;user-select:none}
.st img{width:100%;display:block;border-radius:6px;border:2px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none}
.st:hover{outline:2px dashed var(--accent);outline-offset:2px}
.rs{position:absolute;right:-7px;bottom:-7px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:nwse-resize}
.ro .st{cursor:zoom-in}.ro .st:hover{outline:none}.ro .rs{display:none!important}
html:root:root:root{--paper:#12163a;--paper2:#0e1230;--ink:#e6ecff;--muted:#93a3d6;--accent:#7fb2ff;--line:#2e3870;--danger:#ff8a7a}
.book .left,.book .right{background:radial-gradient(circle 1px at 20% 30%,#fff,transparent) 0 0/260px 260px,radial-gradient(circle 1px at 70% 60%,#cfe8ff,transparent) 0 0/340px 340px,radial-gradient(circle 1.4px at 40% 80%,#fff,transparent) 0 0/180px 180px,radial-gradient(circle 1px at 85% 20%,#bdd8ff,transparent) 0 0/300px 300px,radial-gradient(ellipse at 15% 0%,rgba(110,70,230,.32),transparent 55%) no-repeat,radial-gradient(ellipse at 95% 100%,rgba(30,150,230,.28),transparent 55%) no-repeat,linear-gradient(180deg,#10143a,#080b22)}
.book::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle 1.6px at 15% 25%,#fff,transparent),radial-gradient(circle 1.6px at 60% 12%,#bfe,transparent),radial-gradient(circle 1.6px at 88% 55%,#fff,transparent),radial-gradient(circle 1.6px at 35% 70%,#cdf,transparent),radial-gradient(circle 1.6px at 75% 92%,#fff,transparent),radial-gradient(circle 1.6px at 6% 85%,#bdf,transparent);animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.1}to{opacity:.95}}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(120,180,255,.9)}}
.emblem{animation:pulse 4s ease-in-out infinite}
h1,input.title{text-shadow:0 0 12px color-mix(in srgb,var(--aura) 65%,transparent)}
h3::before{content:"✦ ";color:var(--aura)}
.tech{border-color:color-mix(in srgb,var(--aura) 40%,#1a1f4a);box-shadow:0 0 16px color-mix(in srgb,var(--aura) 22%,transparent)}
textarea.sub{min-height:0;background:transparent;border:none;font:italic 15px/1.5 Georgia,serif;color:var(--muted);padding:6px 0 10px}
button.main,button.main:hover{background:#3b6fe0;border-color:#7fb2ff;color:#fff}
#pg.turn{animation:flip .7s cubic-bezier(.2,.7,.2,1);transform-origin:left center}
@keyframes flip{from{transform:perspective(1800px) rotateY(-75deg);opacity:.15}to{transform:perspective(1800px) rotateY(0);opacity:1}}
.scan{position:absolute;inset:0;z-index:30;pointer-events:none;display:flex;justify-content:center;padding-top:120px;background:linear-gradient(#0a0d24f2,#10143adc);animation:scanout 1.1s ease-in forwards;overflow:hidden}
.scan span{color:#cfe8ff;font-size:20px;letter-spacing:3px;text-shadow:0 0 12px #5fb4ff;animation:blink .45s ease-in-out infinite alternate}
.scan::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#8fd0ff,transparent);box-shadow:0 0 18px #5fb4ff;animation:sweep .9s ease-in-out}
@keyframes sweep{from{top:0}to{top:100%}}
@keyframes scanout{0%,45%{opacity:1}100%{opacity:0}}
@keyframes blink{from{opacity:.4}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#pg.turn{animation:none}.scan{display:none}}
.bar{position:absolute;top:4px;left:4px;display:flex;gap:3px;opacity:.55}
.st:hover .bar{opacity:1}
.bar button{padding:0 5px;font-size:12px;line-height:20px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:8px}
.st.lk{cursor:zoom-in}.st.lk .rs{display:none}.st.lk:hover{outline-color:var(--muted)}
.ro .bar,.ro #imp,.ro #fmt{display:none!important}
:root{--aura:#7fb2ff}
.aura{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.aura .sw{width:16px;height:16px;border-radius:50%;border:2px solid #fff;cursor:pointer;display:inline-block}
.aura input{width:26px;height:22px;padding:0;border:none;background:none;cursor:pointer}
.ro .aura{display:none!important}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:60;width:42px;height:42px;border-radius:50%;padding:0;font-size:18px;background:#0b0f2ae8;border:1px solid #7fb2ff;color:#fff;box-shadow:0 0 14px rgba(90,150,255,.5)}
.rt{width:100%;font:16px/25px Georgia,serif;color:var(--ink);background:repeating-linear-gradient(transparent,transparent 24px,var(--line) 25px);background-attachment:local;border:1px solid transparent;border-radius:4px;padding:2px 6px;min-height:80px;outline:none;overflow-wrap:anywhere}
.rt:focus{border-color:var(--accent)}
.rt:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}
.rt.sub{min-height:46px;background:transparent;border:none;font:italic 15px/1.5 Georgia,serif;color:var(--muted);padding:6px 0 10px}
#fmt{display:none;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;align-items:center;gap:6px;padding:7px 12px;background:#0b0f2ae8;border:1px solid #7fb2ff;border-radius:22px;box-shadow:0 0 22px rgba(90,150,255,.5);max-width:96vw;flex-wrap:wrap;justify-content:center}
#fmt.on{display:flex}
#fmt button{background:transparent;color:#e6ecff;border:1px solid #3b4a8c;padding:2px 9px;border-radius:8px}
#fmt .ic{color:#cfe0ff;font-size:14px}
#fmt .sep{width:1px;height:20px;background:#3b4a8c;margin:0 2px}
#fmt .sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff;cursor:pointer;display:inline-block}
.cover h2{color:var(--ink);font-size:26px;margin:10px 0}
#st{position:fixed;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:2px 10px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
@media(max-width:800px){.book{grid-template-columns:1fr}.left{border-right:none;border-bottom:3px double var(--line)}.right{padding:20px 16px 40px}}
</style>
</head>

<div id="st"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let book={pages:[]},cur=null,ref=null,assets=null,timer,upTarget=null,RO=false;

function status(s){const e=$('#st');e.textContent=s;e.style.display=s?'block':'none'}
function persist(){
  if(RO)return;
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    status('Salvando…');
    try{
      if(ref) await ref.set({pages:book.pages});
      else localStorage.setItem('livro6o',JSON.stringify(book));
      status('Salvo ✓');setTimeout(()=>status(''),1200);
    }catch(e){status('Erro ao salvar')}
  },500);
}
const page=()=>book.pages.find(p=>p.id===cur);

function renderToc(){
  const q=$('#q').value.trim().toLowerCase();
  let h='';
  book.pages.forEach((p,i)=>{
    const techs=p.techs||[];
    const match=!q||(p.name||'').toLowerCase().includes(q)||(p.tn||'').toLowerCase().includes(q)||techs.some(t=>(t.name||'').toLowerCase().includes(q));
    if(!match)return;
    h+=`<a data-go="${p.id}"><div class="p ${p.id===cur?'on':''}"><span><i class="dot" style="background:${p.aura||'#7fb2ff'};box-shadow:0 0 7px ${p.aura||'#7fb2ff'}"></i>${esc(p.name||'Sem nome')}</span><span class="dots"></span><span class="n">${i+2}</span></div>`;
    if(p.tn)h+=`<div class="t" data-go="${p.id}" data-tech="sec-tn">↳ ${esc(p.tn)}</div>`;
    h+='</a>';
  });
  $('#toc').innerHTML=h||'<div class="empty">Nenhum oponente ainda. Comece adicionando um!</div>';
}

function mediaHtml(list,key){
  return (list||[]).map((m,i)=>`<div class="m"><img ${attr(m.url)} alt="" data-zoom><button class="x" data-rm="${key}" data-i="${i}" title="Remover">×</button></div>`).join('');
}

function fit(t){t.style.height='auto';t.style.height=Math.max(t.classList.contains('sub')?46:80,t.scrollHeight+2)+'px'}
function render(){renderToc();renderPage()}
function go(id,techId){
  const fresh=id!==cur;cur=id;render();window.scrollTo({top:0,behavior:'smooth'});
  if(fresh&&page()){flipSound();const el=$('#pg');el.classList.remove('turn');void el.offsetWidth;el.classList.add('turn');el.insertAdjacentHTML('beforeend','<div class="scan"><span>👁 Lendo a técnica…</span></div>');setTimeout(()=>{el.classList.remove('turn');const s=el.querySelector('.scan');if(s)s.remove()},1300)}
  if(techId){const e=document.querySelector(`[data-tid="${techId}"]`)||document.getElementById(techId);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
}

$('#addp').onclick=()=>{const p={id:uid(),name:'',sub:'',notes:'',media:[],techs:[]};book.pages.push(p);persist();go(p.id);const t=document.querySelector('input.title');if(t)t.focus()};
$('#q').oninput=renderToc;

document.addEventListener('click',async e=>{
  const t=e.target;
  const g=t.closest('[data-go]');
  if(g&&t.closest('#toc')){e.preventDefault();return go(g.dataset.go,t.closest('[data-tech]')?.dataset.tech)}
  if(t.dataset.zoom!==undefined){$('#lb img').src=t.src;$('#lb').style.display='flex';return}
  if(t.closest('#lb')){$('#lb').style.display='none';return}
  const p=page();if(!p)return;
